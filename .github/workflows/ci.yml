name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.7
  API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.example.invalid' }}

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Validate Fire OS and HarmonyOS packaging
        run: |
          bash -n packaging/fireos/build_fireos.sh packaging/harmonyos/build_harmonyos.sh
          node --test packaging/fireos/*.test.mjs packaging/harmonyos/*.test.mjs

  web-smoke:
    name: Web release smoke build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Web
        run: flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

  android-tv-smoke:
    name: Android TV release smoke build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=TV_MODE=true

  fireos-smoke:
    name: Amazon Fire OS touch and Fire TV APKs
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Fire OS touch APK
        env:
          FIREOS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./packaging/fireos/build_fireos.sh "$API_BASE_URL" 1.0.0
      - name: Build Fire TV APK
        env:
          FIREOS_BUILD_NUMBER: ${{ github.run_number }}
        run: ./packaging/fireos/build_fireos.sh "$API_BASE_URL" 1.0.0 tv
      - name: Validate Amazon artifacts
        run: |
          test -s dist/fireos/zingchart-fireos-1.0.0-development.apk
          test -s dist/firetv/zingchart-firetv-1.0.0-development.apk

  tv-web-smoke:
    name: webOS and Tizen TV web bundles
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate TV packaging sources
        run: |
          bash -n packaging/tv/build_tv_web.sh packaging/tv/package_tizen.sh
          xmllint --noout packaging/tv/tizen/config.xml
          node -e "JSON.parse(require('fs').readFileSync('packaging/tv/webos/appinfo.json'))"
          node --test packaging/tv/*.test.mjs
      - name: Build Tizen TV project
        run: ./packaging/tv/build_tv_web.sh tizen "$API_BASE_URL" 1.0.0
      - name: Install official webOS CLI
        run: npm install --global @webos-tools/cli@3.2.5
      - name: Build webOS TV IPK
        run: ./packaging/tv/build_tv_web.sh webos "$API_BASE_URL" 1.0.0
      - name: Validate TV artifacts
        run: |
          test -n "$(find dist/webos -maxdepth 1 -name '*.ipk' -print -quit)"
          unzip -t dist/tizen/zingchart-tizen-project-1.0.0.zip

  windows-msix-smoke:
    name: Windows MSIX smoke build
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --dart-define=API_BASE_URL="${{ env.API_BASE_URL }}"
      - name: Build and validate MSIX package layout
        shell: powershell
        run: ./packaging/windows/package_msix.ps1 -Version 1.0.0

  proxy:
    name: Proxy typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-build proxy container
        working-directory: .
        run: docker build --tag zingchart-proxy:ci ./proxy
